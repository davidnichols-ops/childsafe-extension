<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChildSafe Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options-page">
  <h1>ChildSafe Parent Settings</h1>
  <form id="settings">
    <label>
      Sensitivity (0–1)
      <input type="range" id="sensitivity" min="0" max="1" step="0.05" value="0.7">
      <span id="sensitivity-val">0.7</span>
    </label>
    <label>
      Image action
      <select id="imageMode">
        <option value="blur">Blur</option>
        <option value="hide">Hide</option>
        <option value="remove">Remove</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="textEnabled" checked>
      Warn on PII / grooming keywords in text inputs
    </label>
    <label>
      <input type="checkbox" id="networkBlockEnabled" checked>
      Block known ad/malware networks
    </label>
    <label>
      Parent PIN (salted hash stored locally)
      <input type="password" id="pin" minlength="4">
    </label>
    <button type="submit">Save</button>
  </form>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
